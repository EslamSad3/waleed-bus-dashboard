# BFF contract: P1 resources (001-platform-crud)
#
# T001 drift check (2026-09-11): 29/29 referenced backend ops present in
# bus_api docs/openapi.json — CLEAN, no drift.

Dashboard screens call same-origin `/api/*` (P0 `[...proxy]` forwarder + P1 zod
registry). Table maps each dashboard operation to its backend op, registry
schema, and Arabic failure copy. `P` = platform path (no header),
`T` = tenant path (`x-fleet-id` from fleet-scope cookie).

## Fleets

| Dashboard op | Backend op | Registry schema | Failures (Arabic) |
|---|---|---|---|
| List (search/active/load-more) | `GET /fleets?cursor=&limit=` (P) | query passthrough (`limit` default 20) | 401 → refresh flow (P0) |
| Create | `POST /fleets` (P) | `CreateFleetSchema` (name 1–255, ownerId uuid, ownerRoleSlug opt) | 400/422 → field-mapped "راجع الحقول المطلوبة"; 409 `CONFLICT` → owner-link message |
| Detail | `GET /fleets/{id}` (P) | uuid param | 404 → "العنصر مش موجود في الأسطول ده" |
| Edit / activate toggle | `PATCH /fleets/{id}` (P) | `UpdateFleetSchema` (name 1–255 opt, isActive opt) | 404 Arabic; 400/422 field-mapped |
| Delete (+confirm) | `DELETE /fleets/{id}` (P) | uuid param | 404 Arabic; 409 `CONFLICT` → fleet-referenced message (screen context) |

## Buses

| Dashboard op | Backend op | Registry schema | Failures (Arabic) |
|---|---|---|---|
| List per fleet | `GET /fleets/{fleetId}/buses?cursor=&limit=` (P) | fleet uuid + query | 404 Arabic (bad fleet) |
| Register | `POST /fleets/{fleetId}/buses` (P) | `CreateBusSchema` (registrationNumber 1–50, capacity 1–300 int, plateNumber ≤50 opt) | 409 `CONFLICT` → "رقم التسجيل مستخدم قبل كده" |
| Detail | `GET /fleets/{fleetId}/buses/{id}` (P) | uuids | 404/`RESOURCE_NOT_OWNED` Arabic |
| Edit plate/capacity | `PATCH /fleets/{fleetId}/buses/{id}` (P) | `UpdateBusSchema` | 409 `CONFLICT` → registration-taken message |
| Disable / reactivate | `POST /fleet/buses/{busId}/disable\|reactivate` (T) | bus uuid | 409 `BUS_ACTION_NOT_ALLOWED` → "العملية مرفوضة: الأتوبيس عليه رحلة شغالة (DEPARTED)" |
| Assign / unassign driver | `POST\|DELETE /fleet/buses/{busId}/driver` (T) | `AssignDriverSchema` (driverUserId uuid) | 409 `DRIVER_ASSIGNMENT_NOT_ALLOWED` → "تعيين السواق مرفوض: مش نشط أو من أسطول تاني"; re-assign same → success |
| Per-bus trips tab | `GET /fleet/buses/{busId}/trips?cursor=&limit=` (T) | bus uuid + query | 404 Arabic |

