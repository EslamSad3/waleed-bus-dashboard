## Members + drivers roster

| Dashboard op | Backend op | Registry schema | Failures (Arabic) |
|---|---|---|---|
| List members | `GET /fleets/{fleetId}/members?cursor=&limit=` (P) | fleet uuid + query | 404 Arabic |
| Add member | `POST /fleets/{fleetId}/members` (P) | `AddMemberSchema` (userId uuid, roleSlug/roleId opt, status opt) | 404 (user/role) Arabic; 409 `CONFLICT` → member-exists message |
