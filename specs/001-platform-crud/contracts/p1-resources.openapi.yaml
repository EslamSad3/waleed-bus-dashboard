| Remove (+warning+confirm) | `DELETE /fleets/{fleetId}/members/{memberId}` (P) | uuids | 404 Arabic |
| Drivers roster | `GET /fleet/drivers?cursor=&limit=` (T) | query | missing scope → "اختار الأسطول الأول" |
| Invite driver | `POST /fleet/drivers` (T) | `AddDriverSchema` (userId XOR phone+name+password, roleSlug default driver) | 422 invalid combo → field-mapped; 409 non-driver role → driver message |
| Driver detail/history | `GET /fleet/drivers/{driverId}` (T) | driver uuid | 404 Arabic |
| Driver role/status (+warning) | `PATCH /fleet/drivers/{driverId}` (T) | `UpdateDriverSchema` | 404/409 Arabic |
| Remove driver (+confirm) | `DELETE /fleet/drivers/{driverId}` (T) | driver uuid | 404 Arabic |

## Shared rules (all P1 ops)

- Envelope unwrapped once; `{items, nextCursor}` passed through, cursor opaque.
- Mutations: `Origin` check (P0), `cache: no-store`, zod re-validation in proxy registry, `details.fields` → form fields.
- Toast names the audited action (Principle VI); every screen stays behind the super_admin guard (Principle I).
- Registry schemas live in `lib/schemas/p1.ts`; error keys in `contracts/error-map-additions.ar-EG.json` (merged into `error-map.ar-EG.json` at implement).
